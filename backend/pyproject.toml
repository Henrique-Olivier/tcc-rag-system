[project]
name = "rag-tcc-backend"
version = "0.1.0"
description = "API e worker do assistente de pesquisa para TCC (RAG)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "openai>=1.50",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.5",
    "pymupdf>=1.24",
    "sentence-transformers>=3.0",
    "sqlalchemy>=2.0",
    "torch>=2.4",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: roda contra o Postgres do Compose (banco rag_test)",
]
