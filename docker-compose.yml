# Serviços do plano, seção 11. Todas as portas só em 127.0.0.1.
name: rag-tcc

x-backend: &backend
  build: ./backend
  image: rag-tcc-backend
  env_file: .env
  volumes:
    - pdfs:/data/pdfs
    - hf-cache:/hf-cache
  depends_on:
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *backend
    command: alembic upgrade head
    volumes: []
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --workers 1
    environment:
      OMP_NUM_THREADS: ${API_TORCH_THREADS:-2}
      MKL_NUM_THREADS: ${API_TORCH_THREADS:-2}
      TOKENIZERS_PARALLELISM: "false"
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *backend
    command: nice -n 10 python -m app.worker
    cpus: "4"
    environment:
      OMP_NUM_THREADS: ${WORKER_TORCH_THREADS:-4}
      MKL_NUM_THREADS: ${WORKER_TORCH_THREADS:-4}
      TOKENIZERS_PARALLELISM: "false"

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      API_PROXY_TARGET: http://api:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  pdfs:
  hf-cache:
